name: Feature request
description: Propose a capability or change
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: security
    attributes: { label: Security considerations, description: "Does it touch secrets, the sandbox, network, approvals or computer use?" }
